version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
      day: friday
      time: "20:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    groups:
      radix:
        patterns:
          - "@radix-ui/*"
      sanity:
        patterns:
          - sanity
          - next-sanity
          - "@sanity/*"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
          - tailwind-merge
      types:
        patterns:
          - "@types/*"
