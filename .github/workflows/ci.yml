name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FILTER_ARGS: ${{ github.event_name == 'pull_request' && format('--filter=...[{0}]', github.event.pull_request.base.sha) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: "0"

      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx --no-install commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
          else
            npx --no-install commitlint --last --verbose
          fi

      - name: Typegen drift check
        run: |
          npx --no-install turbo run typegen --filter=@bv/studio
          if ! git diff --quiet -- apps/studio/schema.json apps/website/sanity.types.ts; then
            echo "Sanity typegen produced changes. Commit schema.json / sanity.types.ts."
            git diff -- apps/studio/schema.json apps/website/sanity.types.ts
            exit 1
          fi

      - name: Typecheck
        run: npx --no-install turbo run typecheck $FILTER_ARGS

      - name: Test
        run: npx --no-install turbo run test $FILTER_ARGS

      - name: Lint
        run: npx --no-install turbo run lint $FILTER_ARGS
